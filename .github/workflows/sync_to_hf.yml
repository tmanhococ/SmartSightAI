name: Sync to Hugging Face Spaces
on:
  push:
    branches: [huggingface-deployment]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to HF (Orphaned Push to bypass history binaries)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Clean up documentation directory
          rm -rf docs
          # Remove original git tracking to create a clean single-commit history
          rm -rf .git
          git init
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git checkout -b main
          git add .
          git commit -m "deploy to Hugging Face Spaces"
          git push --force https://tmanhococ:$HF_TOKEN@huggingface.co/spaces/tmanhococ/SmartSightAI main:refs/heads/main
