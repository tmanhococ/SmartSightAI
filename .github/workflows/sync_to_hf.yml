name: Sync to Hugging Face Spaces
on:
  push:
    branches: [huggingface-deployment]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to HF
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git push --force https://tmanhococ:$HF_TOKEN@huggingface.co/spaces/tmanhococ/SmartSightAI HEAD:refs/heads/main
